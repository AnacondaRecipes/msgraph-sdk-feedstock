{% set name = "msgraph-sdk" %}
{% set version = "1.20.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/msgraph_sdk-{{ version }}.tar.gz
  sha256: 8d9ab2ce7260af7af3300c4d9917f66c9930dae5f71d075e713512aa300afc4f


build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - flit-core
    - pip
  run:
    - python
    - azure-identity
    - microsoft-kiota-serialization-json
    - microsoft-kiota-serialization-text
    - microsoft-kiota-serialization-form
    - microsoft-kiota-serialization-multipart
    - msgraph-core

test:
  imports:
    - msgraph
  commands:
    - pip check
  requires:
    - python
    - pip

about:
  home: https://github.com/microsoftgraph/msgraph-sdk-python
  summary: The Microsoft Graph Python SDK
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/microsoftgraph/msgraph-sdk-python
  doc_url: https://github.com/microsoftgraph/msgraph-sdk-python#readme


extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/64252
    reason: Client request
  recipe-maintainers:
    - ianaobi
    - bkreider
  recipe-maintainers:
    - maresb

